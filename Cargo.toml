[package]
name = "spark"
version = "0.2.0"
edition = "2021"
description = "Pure-Rust multi-agent desktop GUI for Antigravity, Claude Code, and OpenCode"
license = "MIT OR Apache-2.0"
repository = "https://github.com/silkpanda/spark"
readme = "README.md"

[dependencies]
eframe = "0.31"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
which = "7"
rfd = "0.15"
uuid = { version = "1", features = ["v4"] }
